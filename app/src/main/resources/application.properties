# gRPC server port
quarkus.grpc.server.port=9000

# Share HTTP and gRPC on the same port (Quarkus 3.x default)
quarkus.grpc.server.use-separate-server=false

# Enable gRPC reflection service so grpcurl can list/describe services
quarkus.grpc.server.enable-reflection-service=true

# Include proto descriptor files and service configs in native image resources.
# Without this, proto descriptors (used for JSON transcoding and reflection)
# are stripped from the native binary.
quarkus.native.resources.includes=META-INF/services/**,proto/**
