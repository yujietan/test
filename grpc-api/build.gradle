plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
    // Embeds META-INF/jandex.idx so any Quarkus app depending on this JAR
    // gets full type-hierarchy visibility without needing
    // quarkus.index-dependency in its application.properties.
    id 'org.kordamp.gradle.jandex' version '2.1.0'
}

def grpcVersion = '1.62.2'
def protobufVersion = '3.25.3'

dependencies {
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    // Required for @Generated annotation on generated stubs (Java 9+)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
